<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070609" />
    <meta name="color-scheme" content="dark" />
    <title>StreamFree TV</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section id="splash" role="status" aria-label="StreamFree TV is loading">
      <div class="splash-noise" aria-hidden="true"></div>
      <div class="splash-spotlight" aria-hidden="true"></div>
      <div class="splash-film splash-film-one" aria-hidden="true"></div>
      <div class="splash-film splash-film-two" aria-hidden="true"></div>
      <div class="splash-posters" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="splash-center">
        <div class="splash-reel" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
          <svg viewBox="0 0 64 64"><path d="M12 14h36v9H23v6h20v9H23v8h27v9H12V14Z"></path><path class="play-cut" d="m43 20 12 8-12 8V20Z"></path></svg>
        </div>
        <div class="splash-word" aria-label="StreamFree"><span>S</span><span>T</span><span>R</span><span>E</span><span>A</span><span>M</span><span>F</span><span>R</span><span>E</span><span>E</span></div>
        <p>Made for the biggest screen in the room</p>
        <div class="splash-progress"><span></span></div>
      </div>
      <div class="splash-curtain splash-curtain-left" aria-hidden="true"></div>
      <div class="splash-curtain splash-curtain-right" aria-hidden="true"></div>
    </section>

    <div id="app" hidden>
      <header class="app-header">
        <a class="brand pressable" href="#/home" aria-label="StreamFree TV home">
          <b><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M5 5h20v6H11v3h11v5H11v6H5V5Z"></path><path class="brand-play" d="m20 10 7 5-7 5v-10Z"></path></svg></b>
          <span>STREAMFREE <small>TV</small></span>
        </a>
        <p class="remote-status"><i></i> Mi TV remote ready</p>
        <div class="header-actions">
          <button class="header-action pressable" type="button" data-route="search" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"></circle><path d="m15.2 15.2 4.2 4.2"></path></svg>
          </button>
          <button id="account-button" class="account-button pressable" type="button" data-route="space" aria-label="Open your account"><span>SF</span><i></i></button>
        </div>
      </header>

      <nav class="tab-bar" aria-label="Main navigation">
        <a href="#/home" data-tab="home" class="pressable"><svg viewBox="0 0 24 24"><path d="M4 10.1 12 3.8l8 6.3v9.1a1 1 0 0 1-1 1h-4.4v-5.8H9.4v5.8H5a1 1 0 0 1-1-1v-9.1Z"></path></svg><small>Home</small></a>
        <a href="#/search" data-tab="search" class="pressable"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2"></circle><path d="m15.2 15.2 4.2 4.2"></path></svg><small>Search</small></a>
        <a href="#/browse" data-tab="browse" class="pressable"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"></path></svg><small>Browse</small></a>
        <a href="#/anime" data-tab="anime" class="pressable"><svg viewBox="0 0 24 24"><path d="M12 4c2.4 2.8 2.4 6 0 8.8C9.6 10 9.6 6.8 12 4Z"></path><path d="M12 12.8c3.1-1.4 6-.6 8 2.1-3.4 1-6.2.2-8-2.1Zm0 0c-3.1-1.4-6-.6-8 2.1 3.4 1 6.2.2 8-2.1ZM12 15v5"></path></svg><small>Anime</small></a>
        <a href="#/space" data-tab="space" class="pressable"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5.2 20c.7-3.5 3.4-5.4 6.8-5.4s6.1 1.9 6.8 5.4"></path></svg><small>You</small></a>
      </nav>

      <div id="network-banner" class="network-banner" hidden>Offline mode · showing saved content</div>
      <main id="view" aria-live="polite"></main>

      <aside class="remote-guide" aria-hidden="true">
        <span><kbd>↑↓←→</kbd> Move</span><span><kbd>OK</kbd> Select</span><span><kbd>Back</kbd> Return</span><span><kbd>Menu</kbd> Servers</span>
      </aside>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="sheet-root"></div>
    <script src="./app.bundle.js" defer></script>
  </body>
</html>
